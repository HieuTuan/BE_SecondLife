spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}

# Security & JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Google OAuth2
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Token Lifespans
app.auth.email-verification-expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS}
app.auth.password-reset-expiration-ms=${PASSWORD_RESET_EXPIRATION_MS}

# Admin Seeder
app.seeder.admin.enabled=${SEED_ADMIN_ENABLED}
app.seeder.admin.email=${SEED_ADMIN_EMAIL}
app.seeder.admin.password=${SEED_ADMIN_PASSWORD}
app.seeder.admin.full-name=${SEED_ADMIN_FULL_NAME}
