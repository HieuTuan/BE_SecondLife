# Optional least-privilege deployment. All credentials come from the deployment secret store.
spring.datasource.url=${RUNTIME_DB_URL}
spring.datasource.username=${RUNTIME_DB_USERNAME}
spring.datasource.password=${RUNTIME_DB_PASSWORD}
spring.datasource.hikari.schema=${APP_DB_SCHEMA:public}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=${APP_DB_SCHEMA:public}
spring.sql.init.mode=never

# Flyway gets its own owner datasource; it must never fall back to the runtime account.
spring.flyway.enabled=true
spring.flyway.url=${MIGRATION_DB_URL}
spring.flyway.user=${MIGRATION_DB_USERNAME}
spring.flyway.password=${MIGRATION_DB_PASSWORD}
spring.flyway.default-schema=${APP_DB_SCHEMA:public}
spring.flyway.schemas=${APP_DB_SCHEMA:public}
