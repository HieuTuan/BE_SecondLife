spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}

# Security & JWT
# Legacy permissions-enabled setting is no longer used: authorization is always enforced.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}
app.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_SMTP_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_SMTP_WRITE_TIMEOUT}

# Google OAuth2
app.google.client-id=${GOOGLE_CLIENT_ID}

# Token Lifespans
app.auth.email-verification-expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS}
app.seller-onboarding.email.otp-ttl-seconds=${SELLER_ONBOARDING_OTP_TTL_SECONDS}
app.seller-onboarding.email.resend-cooldown-seconds=${SELLER_ONBOARDING_OTP_RESEND_COOLDOWN_SECONDS}
app.seller-onboarding.email.max-attempts=${SELLER_ONBOARDING_OTP_MAX_ATTEMPTS}
app.auth.password-reset-expiration-ms=${PASSWORD_RESET_EXPIRATION_MS}

# Seeder Configuration
app.catalog.seed-enabled=${APP_CATALOG_SEED_ENABLED}
app.seeder.enabled=${SEEDER_ENABLED}
app.seeder.admin.enabled=${SEED_ADMIN_ENABLED}
app.seeder.admin.email=${SEED_ADMIN_EMAIL}
app.seeder.admin.password=${SEED_ADMIN_PASSWORD}
app.seeder.admin.full-name=${SEED_ADMIN_FULL_NAME}

# Seller Seeder
app.seeder.seller.enabled=${SEED_SELLER_ENABLED}
app.seeder.seller.email=${SEED_SELLER_EMAIL}
app.seeder.seller.password=${SEED_SELLER_PASSWORD}
app.seeder.seller.full-name=${SEED_SELLER_FULL_NAME}
app.seeder.buyer.enabled=${SEED_BUYER_ENABLED}
app.seeder.buyer.email=${SEED_BUYER_EMAIL}
app.seeder.buyer.password=${SEED_BUYER_PASSWORD}
app.seeder.buyer.full-name=${SEED_BUYER_FULL_NAME}

# Staff Seeder
app.seeder.staff.enabled=${SEED_STAFF_ENABLED}
app.seeder.staff.email=${SEED_STAFF_EMAIL}
app.seeder.staff.password=${SEED_STAFF_PASSWORD}
app.seeder.staff.full-name=${SEED_STAFF_FULL_NAME}

# Inspection Center Seeder
app.seeder.inspection-center.enabled=${SEED_INSPECTION_CENTER_ENABLED}
app.seeder.inspection-center.email=${SEED_INSPECTION_CENTER_EMAIL}
app.seeder.inspection-center.password=${SEED_INSPECTION_CENTER_PASSWORD}
app.seeder.inspection-center.full-name=${SEED_INSPECTION_CENTER_FULL_NAME}

# Inspector Seeder
app.seeder.inspector.enabled=${SEED_INSPECTOR_ENABLED}
app.seeder.inspector.email=${SEED_INSPECTOR_EMAIL}
app.seeder.inspector.password=${SEED_INSPECTOR_PASSWORD}
app.seeder.inspector.full-name=${SEED_INSPECTOR_FULL_NAME}

# Spring AI Ollama
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL}
spring.ai.ollama.chat.options.model=${SPRING_AI_OLLAMA_CHAT_MODEL}
ollama.api-key=${OLLAMA_API_KEY}
app.ai.connect-timeout-ms=${AI_CONNECT_TIMEOUT_MS}
app.ai.streaming-connect-timeout-ms=${AI_STREAMING_CONNECT_TIMEOUT_MS}
app.ai.read-timeout-ms=${AI_READ_TIMEOUT_MS}
app.ai.max-retries=${AI_MAX_RETRIES}
app.ai.retry-initial-interval-ms=${AI_RETRY_INITIAL_INTERVAL_MS}
app.ai.retry-multiplier=${AI_RETRY_MULTIPLIER}
app.ai.retry-max-interval-ms=${AI_RETRY_MAX_INTERVAL_MS}
app.ai.google.base-url=${GOOGLE_AI_BASE_URL}
app.ai.google.timeout-ms=${GOOGLE_AI_TIMEOUT_MS}
app.ai.google.connect-timeout-ms=${GOOGLE_AI_CONNECT_TIMEOUT_MS}
app.ai.google.read-timeout-ms=${GOOGLE_AI_READ_TIMEOUT_MS}
app.ai.google.write-timeout-ms=${GOOGLE_AI_WRITE_TIMEOUT_MS}
app.ai.google.retry-attempts=${GOOGLE_AI_RETRY_ATTEMPTS}
app.ai.google.retry-initial-delay-seconds=${GOOGLE_AI_RETRY_INITIAL_DELAY_SECONDS}
app.ai.google.retry-max-delay-seconds=${GOOGLE_AI_RETRY_MAX_DELAY_SECONDS}
app.ai.google.retry-multiplier=${GOOGLE_AI_RETRY_MULTIPLIER}
app.ai.google.retry-jitter=${GOOGLE_AI_RETRY_JITTER}
app.ai.google.retry-http-status-codes=${GOOGLE_AI_RETRY_HTTP_STATUS_CODES}
app.ai.chat.rate-limit-max-messages=${APP_AI_CHAT_RATE_LIMIT_MAX_MESSAGES:50}
app.ai.chat.rate-limit-window-seconds=${APP_AI_CHAT_RATE_LIMIT_WINDOW_SECONDS:3600}
app.ai.chat.session-max-messages=${APP_AI_CHAT_SESSION_MAX_MESSAGES:20}

# Spring AI Google GenAI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=${SPRING_AI_GOOGLE_GENAI_CHAT_MODEL}

# Banner Configuration
spring.banner.location=${SPRING_BANNER_LOCATION}
spring.main.banner-mode=${SPRING_MAIN_BANNER_MODE}

# eKYC Configuration (VNPT eKYC Provider)
app.ekyc.provider=${VNPT_EKYC_PROVIDER}
app.vnpt.base-url=${VNPT_EKYC_API_BASE_URL}
app.vnpt.client-id=${VNPT_EKYC_SERVER_CLIENT_ID}
app.vnpt.client-secret=${VNPT_EKYC_SERVER_CLIENT_SECRET}
app.vnpt.token-id=${VNPT_EKYC_TOKEN_ID}
app.vnpt.token-key=${VNPT_EKYC_TOKEN_KEY}
app.vnpt.mac-address=${VNPT_EKYC_MAC_ADDRESS}
app.vnpt.timeout-ms=${VNPT_EKYC_TIMEOUT_MS}
app.ekyc.vnpt.max-image-bytes=${VNPT_MAX_IMAGE_BYTES}
app.ekyc.vnpt.token-refresh-margin-millis=${VNPT_TOKEN_REFRESH_MARGIN_MILLIS}
app.ekyc.max-retries=${VNPT_EKYC_MAX_RETRIES}
app.ekyc.max-resubmissions=${VNPT_EKYC_MAX_RESUBMISSIONS}
app.ekyc.recovery.enabled=${VNPT_EKYC_RECOVERY_ENABLED}
app.ekyc.recovery.interval-ms=${VNPT_EKYC_RECOVERY_INTERVAL_MS}
app.ekyc.recovery.delay-ms=${VNPT_EKYC_RECOVERY_DELAY_MS}
app.ekyc.recovery.max-attempts=${VNPT_EKYC_RECOVERY_MAX_ATTEMPTS}
app.ekyc.recovery.batch-size=${VNPT_EKYC_RECOVERY_BATCH_SIZE}

# Seller Risk Decision Engine
app.risk.duplicate-check-enabled=${RISK_DUPLICATE_CHECK_ENABLED}
app.risk.seller-review-threshold=${RISK_SELLER_REVIEW_THRESHOLD}
app.risk.duplicate-identity-score=${APP_RISK_DUPLICATE_IDENTITY_SCORE}
app.risk.repeated-failure-score=${APP_RISK_REPEATED_FAILURE_SCORE}
app.risk.borderline-face-match-score=${APP_RISK_BORDERLINE_FACE_MATCH_SCORE}
app.risk.repeated-failure-threshold=${APP_RISK_REPEATED_FAILURE_THRESHOLD}
app.risk.borderline-face-match-threshold=${APP_RISK_BORDERLINE_FACE_MATCH_THRESHOLD}

# Cloudinary Media Storage
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE}
app.media.max-file-size-bytes=${MEDIA_MAX_FILE_SIZE_BYTES}
app.media.default-folder=${MEDIA_DEFAULT_FOLDER}

# Pagination
app.pagination.default-page=${PAGINATION_DEFAULT_PAGE}
app.pagination.default-size=${PAGINATION_DEFAULT_SIZE}
app.pagination.max-size=${PAGINATION_MAX_SIZE}
spring.data.web.pageable.default-page-size=${PAGINATION_DEFAULT_SIZE}
spring.data.web.pageable.max-page-size=${PAGINATION_MAX_SIZE}

# Listing, inspection and negotiation policies
app.inspection.high-value-threshold=${INSPECTION_HIGH_VALUE_THRESHOLD}
app.inspection.inspection-fee=${INSPECTION_FEE}
app.inspection.shipping-fee=${INSPECTION_SHIPPING_FEE}
app.negotiation.max-rejections=${APP_NEGOTIATION_MAX_REJECTIONS}
app.negotiation.accepted-ttl-hours=${APP_NEGOTIATION_ACCEPTED_TTL_HOURS}
app.listing.max-unfinished-drafts=${APP_LISTING_MAX_UNFINISHED_DRAFTS}
app.listing.max-image-bytes=${APP_LISTING_MAX_IMAGE_BYTES}
app.listing.min-images=${LISTING_MIN_IMAGES}
app.listing.max-images=${LISTING_MAX_IMAGES}
app.listing.publish-window-seconds=${APP_LISTING_PUBLISH_WINDOW_SECONDS}
app.listing.publish-limit=${APP_LISTING_PUBLISH_LIMIT}
app.listing.image-similarity.max-dimension=${APP_LISTING_IMAGE_SIMILARITY_MAX_DIMENSION}
app.listing.image-similarity.max-pixels=${APP_LISTING_IMAGE_SIMILARITY_MAX_PIXELS}
app.listing.image-similarity.max-bytes=${APP_LISTING_IMAGE_SIMILARITY_MAX_BYTES}
app.listing.image-similarity.min-variance=${APP_LISTING_IMAGE_SIMILARITY_MIN_VARIANCE}
app.listing.image-similarity.max-hash-distance=${APP_LISTING_IMAGE_SIMILARITY_MAX_HASH_DISTANCE}
app.listing.image-similarity.max-edge-distance=${APP_LISTING_IMAGE_SIMILARITY_MAX_EDGE_DISTANCE}
app.listing.image-similarity.max-color-distance=${APP_LISTING_IMAGE_SIMILARITY_MAX_COLOR_DISTANCE}

# SePay Payment Gateway
app.sepay.bank-account-name=${SEPAY_BANK_ACCOUNT_NAME}
app.sepay.bank-account-number=${SEPAY_BANK_ACCOUNT_NUMBER}
app.sepay.bank-name=${SEPAY_BANK_NAME}
app.sepay.api-token=${SEPAY_API_TOKEN}

# GHN shipping
app.shipping.ghn.enabled=${GHN_ENABLED}
app.shipping.ghn.base-url=${GHN_BASE_URL}
app.shipping.ghn.token=${GHN_TOKEN}
app.shipping.ghn.shop-id=${GHN_SHOP_ID}
app.shipping.ghn.webhook-secret=${GHN_WEBHOOK_SECRET}
app.shipping.ghn.timeout-ms=${GHN_TIMEOUT_MS}
app.shipping.ghn.quote-ttl-seconds=${GHN_QUOTE_TTL_SECONDS}
app.shipping.ghn.max-response-characters=${GHN_MAX_RESPONSE_CHARACTERS}
app.shipping.ghn.webhook-max-future-skew-seconds=${GHN_WEBHOOK_MAX_FUTURE_SKEW_SECONDS}

# Optional mock payment provider; values must be explicitly supplied even when disabled.
app.payment.mock.callback-enabled=${PAYMENT_MOCK_CALLBACK_ENABLED}
app.payment.mock.webhook-secret=${PAYMENT_MOCK_WEBHOOK_SECRET}

