
spring.application.name=${SPRING_APPLICATION_NAME}
server.port=${SERVER_PORT}

# Datasource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}

# Flyway Migration
spring.flyway.enabled=${FLYWAY_ENABLED}

# Security & JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Mail Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
app.mail.from=${MAIL_FROM}

# Token Lifespans
app.auth.email-verification-expiration-ms=${EMAIL_VERIFICATION_EXPIRATION_MS}
app.auth.password-reset-expiration-ms=${PASSWORD_RESET_EXPIRATION_MS}

# Admin Seeder
app.seeder.admin.enabled=${SEED_ADMIN_ENABLED}
app.seeder.admin.email=${SEED_ADMIN_EMAIL}
app.seeder.admin.password=${SEED_ADMIN_PASSWORD}
app.seeder.admin.full-name=${SEED_ADMIN_FULL_NAME}

# Spring AI Ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://127.0.0.1:11434}
spring.ai.ollama.chat.options.model=gemma4:31b-cloud
ollama.api-key=${OLLAMA_API_KEY:}

# Spring AI Google GenAI (API Key only)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

spring.banner.location=classpath:banner.txt
spring.main.banner-mode=console

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:demo}
cloudinary.api-key=${CLOUDINARY_API_KEY:demo}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:demo}
