# Example only: merge into your existing configuration; do not duplicate application.properties.
app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
  video-upload:
    upload-preset: ${CLOUDINARY_VIDEO_UPLOAD_PRESET:}
    max-bytes: 262144000
    max-duration-seconds: 600
    session-ttl-seconds: 3600
    playback-ttl-seconds: 300
    max-sessions-per-hour: 10
    timeout-ms: 10000
    chunk-size-bytes: 6291456
    verification-global-per-hour: 100
    verification-owner-per-hour: 20
    verification-cooldown-seconds: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PATCH,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type
    allow-credentials: false
    max-age-seconds: 3600
